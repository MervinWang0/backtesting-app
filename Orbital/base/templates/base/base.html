{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content = "width = device-width , initial-scale = 1 ">

    <title>
        {% block title %}
            Penny Wise
        {% endblock %}
    </title>

    <link
        rel = "stylesheet"
        href = "{% static 'base/css/dashboard.css' %}"
    >

    <script
        src = "{% static 'base/js/dashboard.js' %}"
        defer
    ></script>
</head>

<body>
    <header class = "site-header">
        <div class = "site-header__inner">
            <a href = "{% url 'dashboard' %}" class = "brand">
                PennyWise
            </a>

            <nav class = "main-navigation" aria-label = "Main Navigation">
                <a
                    href = "{% url 'dashboard' %}"
                    class = "main-navigation__link main-navigation__link--active"
                > 
                Market
            </a>

            <a href = "{% url 'Backtest' %}" class = "main-navigation__link">
                Backtest
            </a>

            <a href = "{% url 'Porfolio' %}" class = "main-navigatioon__link">
                Portfolio
            </a>
            </nav>
        </div>
    </heaader>

    <main>
    {% block content %}
    {% endblock %}
</main>
</body>
</html>
