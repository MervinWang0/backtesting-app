{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content = "width = device-width , initial-scale = 1 ">

    <title>
        {% block title %}
            Penny Wise
        {% endblock %}
    </title>

    <link
        rel = "stylesheet"
        href = "{% static 'base/css/dashboard.css' %}"
    >

    <script
        src = "{% static 'base/js/dashboard.js' %}"
        defer
    ></script>

    <script
        src = "{% static 'base/js/stock.js' %}"
        defer
    ></script>
</head>

<body>
    {% block content %}
    {% endblock %}
</body>

</html>
